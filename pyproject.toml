[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simagora"
version = "0.1.0"
description = "Financial instrument backtesting simulator"
requires-python = ">=3.8"
dependencies = [
  "matplotlib",
  "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]
